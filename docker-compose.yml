services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aivestor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aivestor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: aivestor_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivestor -d aivestor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aivestor-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aivestor:${DB_PASSWORD}@db:5432/aivestor_db
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Aivestor}
      NEXT_PUBLIC_APP_URL: ${NEXTAUTH_URL}
      # 本地化部署默认跳过 SaaS 落地页，直接到登录页（避免 aivestor.cn / 备案中等文案）
      NEXT_PUBLIC_LANDING_MODE: ${NEXT_PUBLIC_LANDING_MODE:-local}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY}
      SYSTEM_DEEPSEEK_API_KEY: ${SYSTEM_DEEPSEEK_API_KEY:-}
      FREE_QUOTA_TOKENS: ${FREE_QUOTA_TOKENS:-5000000}
      # OSS（可选，不填则自动使用本地磁盘存储）
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      LOCAL_UPLOAD_DIR: /app/uploads
      # 邮件（可选）
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_EMAIL_FROM: ${ALIYUN_EMAIL_FROM:-}
      # 短信（可选）
      ALIYUN_SMS_SIGN: ${ALIYUN_SMS_SIGN:-}
      ALIYUN_SMS_TEMPLATE: ${ALIYUN_SMS_TEMPLATE:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "3000:3000"
    healthcheck:
      # 用 node 内置 http 探活 /api/health，避免依赖 curl/wget
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: aivestor-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro  # 放置 SSL 证书（可选）

volumes:
  pgdata:
  uploads:   # 本地文件存储（未配置OSS时使用）
